<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagramio - Reels Social Media & Admin Dashboard</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        instagram: {
                            gradientStart: '#833ab4',
                            gradientMid: '#fd1d1d',
                            gradientEnd: '#fcb045',
                        }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        /* Hide scrollbar for Chrome, Safari and Opera */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        /* Hide scrollbar for IE, Edge and Firefox */
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        /* Reels snap container */
        .reels-container {
            scroll-snap-type: y mandatory;
            overflow-y: scroll;
        }
        .reel-item {
            scroll-snap-align: start;
            scroll-snap-stop: always;
        }
    </style>
</head>
<body class="bg-black text-white antialiased selection:bg-pink-500 selection:text-white min-h-screen flex flex-col justify-between">

    <!-- MAIN APP WRAPPER -->
    <div id="app" class="flex flex-col min-h-screen">

        <!-- TOP BAR (Mobile & Desktop Header) -->
        <header class="sticky top-0 z-50 bg-black/80 backdrop-blur-md border-b border-neutral-800 px-4 py-3 flex items-center justify-between">
            <div class="flex items-center space-x-3 cursor-pointer" onclick="router.navigate('feed')">
                <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-[#833ab4] via-[#fd1d1d] to-[#fcb045] flex items-center justify-center shadow-lg">
                    <i class="fa-solid fa-play text-white text-sm"></i>
                </div>
                <span class="text-xl font-bold tracking-tight bg-gradient-to-r from-purple-400 via-pink-500 to-amber-400 bg-clip-text text-transparent">Instagramio</span>
            </div>
            
            <div class="flex items-center space-x-4">
                <!-- Notifications Bell -->
                <button onclick="toggleNotificationsModal()" class="relative text-xl text-neutral-300 hover:text-white transition">
                    <i class="fa-regular fa-bell"></i>
                    <span id="notif-badge" class="absolute -top-1 -right-1 bg-red-500 text-white text-[10px] rounded-full w-4 h-4 flex items-center justify-center font-bold hidden">0</span>
                </button>
                
                <!-- Auth status / Profile avatar -->
                <div id="header-auth-area">
                    <!-- Populated via JS -->
                </div>
            </div>
        </header>

        <!-- MAIN VIEW CONTAINER -->
        <main id="main-content" class="flex-1 pb-16 md:pb-0">
            <!-- Dynamically injected views go here -->
        </main>

        <!-- BOTTOM NAVIGATION (Mobile) -->
        <nav class="md:hidden fixed bottom-0 left-0 right-0 z-40 bg-black/90 backdrop-blur-md border-t border-neutral-800 px-6 py-3 flex items-center justify-between">
            <button onclick="router.navigate('feed')" class="nav-btn text-xl text-neutral-400 hover:text-white" data-route="feed">
                <i class="fa-solid fa-house"></i>
            </button>
            <button onclick="router.navigate('explore')" class="nav-btn text-xl text-neutral-400 hover:text-white" data-route="explore">
                <i class="fa-solid fa-compass"></i>
            </button>
            <button onclick="openUploadModal()" class="w-10 h-10 rounded-xl bg-gradient-to-tr from-purple-600 via-pink-600 to-amber-500 flex items-center justify-center text-white shadow-md hover:scale-105 transition">
                <i class="fa-solid fa-plus"></i>
            </button>
            <button onclick="router.navigate('notifications')" class="nav-btn text-xl text-neutral-400 hover:text-white relative" data-route="notifications">
                <i class="fa-regular fa-heart"></i>
                <span id="mobile-notif-dot" class="absolute top-0 right-0 w-2 h-2 bg-red-500 rounded-full hidden"></span>
            </button>
            <button onclick="handleProfileNav()" class="nav-btn text-xl text-neutral-400 hover:text-white" data-route="profile">
                <i class="fa-regular fa-user"></i>
            </button>
        </nav>

        <!-- DESKTOP SIDEBAR -->
        <aside class="hidden md:flex flex-col fixed left-0 top-[61px] bottom-0 w-64 bg-black border-r border-neutral-800 p-6 z-30 justify-between">
            <div class="space-y-6">
                <div class="text-xs font-semibold text-neutral-500 uppercase tracking-wider px-3">Menu</div>
                <div class="space-y-1">
                    <button onclick="router.navigate('feed')" class="sidebar-btn w-full flex items-center space-x-4 px-4 py-3 rounded-xl hover:bg-neutral-900 text-neutral-300 hover:text-white transition font-medium" data-route="feed">
                        <i class="fa-solid fa-house text-xl w-6"></i>
                        <span>Reels Feed</span>
                    </button>
                    <button onclick="router.navigate('explore')" class="sidebar-btn w-full flex items-center space-x-4 px-4 py-3 rounded-xl hover:bg-neutral-900 text-neutral-300 hover:text-white transition font-medium" data-route="explore">
                        <i class="fa-solid fa-compass text-xl w-6"></i>
                        <span>Explore</span>
                    </button>
                    <button onclick="openUploadModal()" class="w-full flex items-center space-x-4 px-4 py-3 rounded-xl hover:bg-neutral-900 text-neutral-300 hover:text-white transition font-medium">
                        <i class="fa-solid fa-circle-plus text-xl w-6 text-pink-500"></i>
                        <span>Upload Reel</span>
                    </button>
                    <button onclick="router.navigate('notifications')" class="sidebar-btn w-full flex items-center space-x-4 px-4 py-3 rounded-xl hover:bg-neutral-900 text-neutral-300 hover:text-white transition font-medium relative" data-route="notifications">
                        <i class="fa-regular fa-heart text-xl w-6"></i>
                        <span>Notifications</span>
                        <span id="desktop-notif-badge" class="ml-auto bg-red-500 text-white text-xs px-2 py-0.5 rounded-full hidden">0</span>
                    </button>
                    <button onclick="handleProfileNav()" class="sidebar-btn w-full flex items-center space-x-4 px-4 py-3 rounded-xl hover:bg-neutral-900 text-neutral-300 hover:text-white transition font-medium" data-route="profile">
                        <i class="fa-regular fa-user text-xl w-6"></i>
                        <span>Profile</span>
                    </button>
                </div>
            </div>

            <!-- Admin Nav Link (Super Admin Only) -->
            <div id="sidebar-admin-area" class="pt-6 border-t border-neutral-800">
                <!-- Injected dynamically if Super Admin -->
            </div>
        </aside>

    </div>

    <!-- MODALS & OVERLAYS CONTAINER -->
    <!-- 1. Auth Modal (Sign In / Sign Up) -->
    <div id="auth-modal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 hidden">
        <div class="bg-neutral-900 border border-neutral-800 w-full max-w-md rounded-2xl p-8 relative shadow-2xl">
            <button onclick="closeAuthModal()" class="absolute top-4 right-4 text-neutral-400 hover:text-white text-xl">
                <i class="fa-solid fa-xmark"></i>
            </button>
            <div id="auth-container">
                <!-- Dynamic Auth Content: Sign In / Sign Up / Forgot Password -->
            </div>
        </div>
    </div>

    <!-- 2. Upload Reel Modal -->
    <div id="upload-modal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 hidden">
        <div class="bg-neutral-900 border border-neutral-800 w-full max-w-lg rounded-2xl p-6 relative shadow-2xl">
            <button onclick="closeUploadModal()" class="absolute top-4 right-4 text-neutral-400 hover:text-white text-xl">
                <i class="fa-solid fa-xmark"></i>
            </button>
            <h2 class="text-xl font-bold mb-4 flex items-center gap-2"><i class="fa-solid fa-clapperboard text-pink-500"></i> Upload New Reel</h2>
            <form id="upload-form" onsubmit="handleUploadSubmit(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold uppercase text-neutral-400 mb-1">Select Video Source</label>
                    <div class="grid grid-cols-2 gap-2 mb-2">
                        <button type="button" onclick="setUploadSource('sample')" id="src-sample-btn" class="py-2 px-3 rounded-xl bg-neutral-800 border border-pink-500 text-sm font-medium transition">Use Sample Reel</button>
                        <button type="button" onclick="setUploadSource('url')" id="src-url-btn" class="py-2 px-3 rounded-xl bg-neutral-800 border border-neutral-700 text-sm font-medium transition">Custom Video URL</button>
                    </div>
                    <div id="url-input-container" class="hidden">
                        <input type="url" id="reel-video-url" placeholder="Paste .mp4 video URL..." class="w-full bg-neutral-950 border border-neutral-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-pink-500">
                    </div>
                    <div id="sample-picker-container" class="space-y-2">
                        <select id="reel-sample-select" class="w-full bg-neutral-950 border border-neutral-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-pink-500">
                            <option value="https://assets.mixkit.co/videos/preview/mixkit-girl-in-neon-sign-lights-41695-large.mp4">Neon Lights Girl (Sample 1)</option>
                            <option value="https://assets.mixkit.co/videos/preview/mixkit-set-of-plateaus-seen-from-the-sky-in-a-sunset-26070-large.mp4">Sunset Plateau Drone (Sample 2)</option>
                            <option value="https://assets.mixkit.co/videos/preview/mixkit-woman-running-on-the-beach-at-sunset-41639-large.mp4">Beach Sunset Run (Sample 3)</option>
                            <option value="https://assets.mixkit.co/videos/preview/mixkit-dj-playing-music-at-a-party-41584-large.mp4">DJ Party Night (Sample 4)</option>
                        </select>
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase text-neutral-400 mb-1">Caption</label>
                    <textarea id="reel-caption" rows="3" placeholder="Write an engaging caption..." class="w-full bg-neutral-950 border border-neutral-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-pink-500 resize-none"></textarea>
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase text-neutral-400 mb-1">Hashtags</label>
                    <input type="text" id="reel-hashtags" placeholder="#trending #reels #instagramio" class="w-full bg-neutral-950 border border-neutral-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-pink-500">
                </div>
                <button type="submit" class="w-full py-3 rounded-xl bg-gradient-to-r from-purple-600 via-pink-600 to-amber-500 text-white font-semibold shadow-lg hover:opacity-95 transition">Publish Reel</button>
            </form>
        </div>
    </div>

    <!-- 3. Comments Modal -->
    <div id="comments-modal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-end md:items-center justify-center p-0 md:p-4 hidden">
        <div class="bg-neutral-900 border border-neutral-800 w-full md:max-w-lg h-[80vh] md:h-[600px] rounded-t-3xl md:rounded-2xl flex flex-col relative shadow-2xl overflow-hidden">
            <div class="p-4 border-b border-neutral-800 flex items-center justify-between">
                <h3 class="font-bold text-base">Comments</h3>
                <button onclick="closeCommentsModal()" class="text-neutral-400 hover:text-white text-lg"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div id="comments-list" class="flex-1 overflow-y-auto p-4 space-y-4">
                <!-- Dynamically populated comments -->
            </div>
            <div class="p-4 border-t border-neutral-800 bg-neutral-950">
                <form id="comment-form" onsubmit="handleCommentSubmit(event)" class="flex gap-2">
                    <input type="text" id="comment-input" placeholder="Add a comment..." class="flex-1 bg-neutral-900 border border-neutral-800 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-pink-500">
                    <button type="submit" class="bg-pink-600 text-white px-5 py-2.5 rounded-xl font-semibold text-sm hover:bg-pink-500 transition">Post</button>
                </form>
            </div>
        </div>
    </div>

    <!-- 4. Notifications Drawer / Modal -->
    <div id="notifications-modal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 hidden">
        <div class="bg-neutral-900 border border-neutral-800 w-full max-w-md h-[500px] rounded-2xl flex flex-col relative shadow-2xl overflow-hidden">
            <div class="p-4 border-b border-neutral-800 flex items-center justify-between">
                <h3 class="font-bold text-base flex items-center gap-2"><i class="fa-regular fa-heart text-pink-500"></i> Notifications</h3>
                <button onclick="toggleNotificationsModal()" class="text-neutral-400 hover:text-white text-lg"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div id="notifications-list" class="flex-1 overflow-y-auto p-4 space-y-3">
                <!-- Dynamically populated notifications -->
            </div>
        </div>
    </div>

    <!-- Toast Notification / Alert Box -->
    <div id="toast-container" class="fixed bottom-20 md:bottom-6 right-6 z-50 flex flex-col space-y-2 pointer-events-none"></div>

    <!-- APPLICATION LOGIC & MOCK BACKEND -->
